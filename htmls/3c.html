<!DOCTYPE html>
<html>
<head>
<title>Climate Awareness</title>
<style>
body {
  font-family: Arial, sans-serif;
}
.container {
  display: flex;
  gap: 20px;
}
aside {
  flex: 1;
  background: lightgreen;
  padding: 15px;
}
article {
  flex: 2;
  background: lightyellow;
  padding: 15px;
}
@media (max-width: 600px) {
  .container {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<h1>Climate Awareness in Kenya</h1>

<div class="container">
  <aside>
    <h2>Quick Facts</h2>
    <p>Plant trees.</p>
    <p>Save water.</p>
    <p>Reduce pollution.</p>
  </aside>

  <article>
    <h2>Climate Change</h2>
    <p>Climate change affects people,
    animals and the environment.</p>
    <p>We should protect forests,
    conserve water and reduce waste.</p>
  </article>
</div>

</body>
</html>
